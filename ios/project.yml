# Xcode project definition. TravelLedger.xcodeproj is generated from this file with XcodeGen
# (`xcodegen` in this folder) and committed, so opening the .xcodeproj works without installing anything.
name: TravelLedger
options:
  bundleIdPrefix: com.archiekuo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant
  createIntermediateGroups: true
packages:
  LedgerCore:
    path: LedgerCore
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Automatic signing: pick your team in Xcode (Signing & Capabilities). Certificates stay in the Mac's keychain.
    CODE_SIGN_STYLE: Automatic
targets:
  TravelLedger:
    type: application
    platform: iOS
    sources:
      - path: TravelLedger
    dependencies:
      - package: LedgerCore
        product: LedgerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.archiekuo.travelledger
        PRODUCT_NAME: TravelLedger
        INFOPLIST_FILE: TravelLedger/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
schemes:
  TravelLedger:
    build:
      targets:
        TravelLedger: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: LedgerCore/LedgerCoreTests
